<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Hoppy Coin</title>
    <meta name="author" content="Sudoist"/>
    <meta name="description" content="Building on top of tutorial >Making your first Phaser 3 Game<"/>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #ccc url(/assets/bg/pattern.webp) repeat;
            overflow: hidden;
        }
        .site-controls { position: fixed; right: 16px; z-index: 100; font: 14px system-ui, sans-serif; }
        .site-controls a, .site-controls summary { display: block; color: #fff; background: #21572f; padding: 9px 13px; border-radius: 8px; text-decoration: none; cursor: pointer; }
        .site-controls a:focus-visible, .site-controls summary:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        .site-controls a:hover, .site-controls summary:hover { background: #317b43; }
        .github-control { top: 16px; }
        .versions-control { bottom: 16px; }
        .versions-control details { position: relative; }
        .versions-control nav { position: absolute; bottom: calc(100% + 8px); right: 0; width: max-content; max-width: min(90vw, 300px); background: #173c24; padding: 6px; border-radius: 8px; box-shadow: 0 4px 18px #0006; }
        .versions-control nav a { background: transparent; }
        .versions-control small { display: block; opacity: .75; }
        @media (max-width: 600px) { .site-controls { right: 8px; font-size: 12px; } .github-control { top: 8px; } .versions-control { bottom: 8px; } }
    </style>
    <meta property="og:image"
          content="/assets/bg/phaser-planet-small.png"/>
